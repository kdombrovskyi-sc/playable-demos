<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lulus – Match &amp; Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Avenir Next", 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100svh; overflow: hidden; }
        .ad-container {
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #faf7f2 0%, #efe6dc 100%);
            position: relative; overflow: hidden; color: #1a1a1a;
            display: flex; flex-direction: column;
        }
        .ad-container::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: radial-gradient(circle at center, rgba(196,147,142,0.06) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .score-pill {
            position: absolute; top: 10px; right: 14px; z-index: 20; color: #1a1a1a;
            font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            padding: 5px 11px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(26,26,26,0.08); box-shadow: 0 2px 8px rgba(26,26,26,0.06);
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 1;
        }
        .screen.active { opacity: 1; pointer-events: auto; z-index: 5; }
        #screen-start {
            background: rgba(250, 247, 242, 0.96);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            justify-content: center; align-items: center; text-align: center; z-index: 25; color: #1a1a1a; gap: 6px;
        }
        .start-logo {
            font-size: clamp(26px, 9vmin, 44px); font-weight: 700; letter-spacing: 0.5px;
            color: #1a1a1a;
            margin-bottom: clamp(6px, 2vmin, 12px);
            text-transform: lowercase;
        }
        .start-title { font-size: clamp(18px,5.2vmin,26px); font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: clamp(3px,1vmin,5px); color: #1a1a1a; }
        .start-subtitle { font-size: clamp(13px,4vmin,16px); font-weight: 400; color: #6b6663; margin-bottom: clamp(10px,4vmin,20px); }
        .start-loading { font-size: clamp(10px,3vmin,12px); color: #a59c97; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: clamp(20px,8vmin,40px); }
        .start-cart {
            font-size: clamp(56px,20vmin,100px); line-height: 1;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 6px 10px rgba(26,26,26,0.18));
        }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        #screen-game {
            top: 40px; height: calc(100% - 40px);
            padding: 8px 10px 10px;
            display: flex; flex-direction: column;
        }
        .game-board {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            min-height: 0; min-width: 0;
        }

        .card { perspective: 1000px; cursor: pointer; width: 100%; height: 100%; min-height: 0; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
        .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 4px 14px rgba(26,26,26,0.10); }
        .card-back { background: linear-gradient(140deg, #ede4dc 0%, #d8c4b8 100%); display: flex; justify-content: center; align-items: center; border: 1px solid rgba(26,26,26,0.06); }
        .card-back::after { content: "\2665"; font-size: clamp(28px,10vmin,52px); font-weight: 300; color: rgba(26,26,26,0.18); }
        .card-front { background: #ffffff; transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 5px 5px 7px; position: relative; overflow: hidden; border: 1px solid rgba(26,26,26,0.06); }
        .card-img { width: 100%; flex: 1 1 auto; min-height: 0; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
        .card-name { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; text-align: center; line-height: 1.1; color: #1a1a1a; flex-shrink: 0; text-transform: uppercase; }
        .match-badge {
            position: absolute; top: 6px; right: 6px; width: 24px; height: 24px;
            background: #0FADFF; border-radius: 100px;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0);
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275) 0.3s; z-index: 10;
            box-shadow: 0 2px 6px rgba(26,26,26,0.20);
        }
        .match-badge svg { width: 16px; height: 16px; display: block; }
        .card.matched .match-badge { opacity: 1; transform: scale(1); }

        /* Invisible right-edge strip used during gameplay to capture "skip to end card"
           taps. Sits above the card grid so right-edge taps don't accidentally flip cards. */
        .skip-strip-right {
            position: absolute; top: 0; right: 0;
            width: 15%; height: 100%;
            z-index: 25; pointer-events: none;
        }
        .skip-strip-right.active { pointer-events: auto; }

        .overlay-screen {
            background: rgba(26, 22, 20, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            justify-content: center; align-items: center;
            padding: clamp(12px,5vmin,20px); z-index: 30;
            transition: background 0.5s ease, backdrop-filter 0.5s ease, -webkit-backdrop-filter 0.5s ease;
        }
        #screen-result { z-index: 30; }
        .result-heading {
            font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0;
            color: rgba(255,255,255,0.75); text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.50);
            text-transform: uppercase; margin-bottom: 16px;
        }
        .result-card {
            background: #faf7f2; color: #1a1a1a; width: 78%; max-width: 320px;
            border-radius: 6px; padding: 28px 24px 24px; text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.35);
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 22px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .result-card:active { transform: scale(0.98); }
        .result-emoji {
            font-size: clamp(80px,28vmin,140px); line-height: 1.1;
            margin-bottom: clamp(4px,2vmin,10px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            animation: pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .result-title { font-size: 22px; font-weight: 600; line-height: 28px; letter-spacing: 0; color: #000; text-align: center; margin-bottom: clamp(6px,2vmin,10px); }
        .result-desc { font-size: 14px; font-weight: 500; line-height: 20px; color: #646567; text-align: center; letter-spacing: 0; }
        .cta-btn {
            padding: 10px 12px 8px 10px;
            background: #FFFFFF;
            box-shadow: 0px 2px 12px rgba(0, 0, 0, 0.13);
            border: none;
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            display: inline-flex;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .cta-btn-inner {
            justify-content: center;
            align-items: center;
            gap: 8px;
            display: inline-flex;
        }
        .cta-btn .icon-wrap {
            width: 24px;
            height: 24px;
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-2px);
        }
        .cta-btn .icon-wrap svg {
            width: 24px;
            height: 24px;
            display: block;
        }
        .cta-btn-text {
            justify-content: center;
            display: flex;
            flex-direction: column;
            color: #000;
            font-size: 22px;
            font-weight: 600;
            line-height: 28px;
            word-wrap: break-word;
            text-shadow: 0px 2px 20px rgba(79, 20, 20, 0.25);
        }
        .cta-btn:active { background: #EEEEEE; }
        .play-again-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 100px;
            padding: clamp(8px, 2.5vmin, 12px) clamp(18px, 5.5vmin, 26px);
            font-size: 14px;
            font-style: normal;
            font-weight: 600;
            line-height: 20px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: clamp(5px, 1.5vmin, 7px);
            transition: all 0.2s;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.13);
        }
        .play-again-btn:active { color: white; }
        .confetti { position: absolute; pointer-events: none; z-index: 29; }
    </style>
</head>
<body>
<div class="ad-container">

    <div id="screen-start" class="screen active">
        <div class="start-logo">LULUS</div>
        <h2 class="start-title">Match &amp; Style</h2>
        <p class="start-subtitle">Pair the looks to win.</p>
        <p class="start-loading">Get ready to play...</p>
        <div class="start-cart" aria-hidden="true">🛍️</div>
    </div>

    <div class="score-pill">✨ <span id="score-text">0/3</span></div>
    <div class="skip-strip-right" id="skip-strip-right" aria-hidden="true"></div>

    <div id="screen-game" class="screen">
        <div class="game-board" id="board"></div>
    </div>

    <div id="screen-result" class="screen overlay-screen">
        <div class="result-heading" id="result-heading">You've Got Style</div>
        <div class="result-card" onclick="handleCTA()" role="button" tabindex="0">
            <div class="result-emoji">🛍️</div>
            <h2 class="result-title">Free Shipping Unlocked</h2>
            <p class="result-desc">On orders $50+ at lulus.com</p>
        </div>
        <button class="cta-btn" onclick="handleCTA()">
            <span class="cta-btn-inner">
                <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none"><path fill="#0894FA" d="M13.05 3.53a5.26 5.26 0 0 1 7.42 0v-.01a5.26 5.26 0 0 1 0 7.42l-3.52 3.51a5.26 5.26 0 0 1-7.72-.32 1 1 0 0 1 .12-1.41 1 1 0 0 1 1.4.12l.2.2a3.26 3.26 0 0 0 4.6 0l3.5-3.51a3.26 3.26 0 0 0 0-4.59 3.26 3.26 0 0 0-4.59 0L12.7 6.7a1 1 0 0 1-1.41-1.41z"/><path fill="#0894FA" d="m9.53 19.04 1.78-1.75a1 1 0 0 1 1.41 1.41l-1.76 1.76a5.23 5.23 0 0 1-7.43 0 5.26 5.26 0 0 1 0-7.42l3.52-3.51a5.26 5.26 0 0 1 7.71.32 1 1 0 0 1-.12 1.41 1 1 0 0 1-1.4-.12l-.2-.2a3.26 3.26 0 0 0-4.6 0l-3.5 3.51a3.26 3.26 0 0 0 0 4.59 3.26 3.26 0 0 0 4.59 0"/></svg></span>
                <span class="cta-btn-text">Shop Lulus</span>
            </span>
        </button>
        <button class="play-again-btn" onclick="resetGame()"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.00008 2.00001C2.00008 1.63334 1.70008 1.33334 1.33341 1.33334C0.966748 1.33334 0.666748 1.63334 0.666748 2.00001V6.67334C0.666748 7.04001 0.966748 7.34001 1.33341 7.34001H5.99341C6.36008 7.34001 6.66008 7.04001 6.66008 6.67334C6.66008 6.30668 6.36008 6.00668 5.99341 6.00668H3.04675C3.84675 4.00668 5.77342 2.67334 7.99341 2.67334C10.9334 2.67334 13.3267 5.06668 13.3267 8.00668C13.3267 10.9467 10.9334 13.34 7.99341 13.34C5.98008 13.34 4.16675 12.2 3.26008 10.3733C3.10008 10.0467 2.70008 9.90668 2.36675 10.0733C2.04008 10.24 1.90008 10.6333 2.06675 10.9667C3.20675 13.2467 5.48008 14.6667 8.00008 14.6667C11.6734 14.6667 14.6667 11.6733 14.6667 8.00001C14.6667 4.32668 11.6734 1.33334 8.00008 1.33334C5.38008 1.33334 3.08675 2.82668 2.00008 5.09334V2.00001Z" fill="#B0B1B2"/></svg> Play Again</button>
    </div>

</div>

    const menuItems = [
        { id: 'tank',   imgSrc: CARD1_SRC, name: 'Crop Tank' },
        { id: 'halter', imgSrc: CARD2_SRC, name: 'Shell Halter' },
        { id: 'maxi',   imgSrc: CARD3_SRC, name: 'Knit Maxi' }
    ];

    let hasFlippedCard = false, lockBoard = false, firstCard, secondCard, matchesFound = 0;
    const boardElement = document.getElementById('board');
    const scoreTextEl = document.getElementById('score-text');
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenResult = document.getElementById('screen-result');
    const skipStripRight = document.getElementById('skip-strip-right');

    let hasStarted = false;
    let isPlaying = false;
    let gameStartTime = 0;
    const SKIP_TO_END_THRESHOLD_MS = 1000;

    function setLeftNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setLeftNavZoneEnabled === 'function') {
            ScPlayableAd.setLeftNavZoneEnabled(enabled);
        }
    }
    function setRightNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setRightNavZoneEnabled === 'function') {
            ScPlayableAd.setRightNavZoneEnabled(enabled);
        }
    }

    function beginCountdown() {
        setTimeout(() => {
            screenStart.classList.remove('active');
            screenGame.classList.add('active');
            initGame();
        }, 700);
    }

    function tryStart() {
        if (hasStarted) return;
        hasStarted = true;
        beginCountdown();
    }

    function onViewable(viewable) {
        if (viewable && !hasStarted) tryStart();
    }

    if (typeof mraid !== 'undefined') {
        mraid.addEventListener('viewableChange', onViewable);
        if (mraid.getState() !== 'loading' && mraid.isViewable()) {
            tryStart();
        }
        mraid.addEventListener('ready', function () {
            if (mraid.isViewable()) tryStart();
        });
    } else {
        beginCountdown();
    }

    // End-card left-edge tap (outside the card/buttons) restarts the game.
    screenResult.addEventListener('click', (e) => {
        if (e.target !== screenResult) return;
        if (e.clientX >= window.innerWidth * 0.15) return;
        resetGame();
    });

    // Gameplay tap-anywhere-to-skip. After a 1s grace window, any tap that is
    // NOT on a card jumps straight to the end card. Mirrors Aero's behavior.
    function maybeSkipToEnd() {
        if (!isPlaying) return false;
        if (Date.now() - gameStartTime < SKIP_TO_END_THRESHOLD_MS) return false;
        triggerWin();
        return true;
    }

    function triggerWin() {
        if (!isPlaying) return;
        isPlaying = false;
        showResult();
    }

    // Listen on the ad container so taps on the score-pill, the top strip, or
    // anywhere outside screen-game's DOM still trigger skip.
    document.querySelector('.ad-container').addEventListener('click', (e) => {
        if (!isPlaying) return;
        if (e.target.closest('.card')) return;
        if (e.target.closest('#screen-start')) return;
        if (e.target.closest('#screen-result')) return;
        maybeSkipToEnd();
    });

    // The right-edge strip steals taps from cards underneath it during gameplay.
    skipStripRight.addEventListener('click', maybeSkipToEnd);

    function initGame() {
        hasFlippedCard = false; lockBoard = false; firstCard = null; secondCard = null; matchesFound = 0;
        scoreTextEl.innerText = '0/3';
        screenResult.classList.remove('active');
        isPlaying = true;
        gameStartTime = Date.now();
        skipStripRight.classList.remove('active');
        // After the grace window, capture the right-nav strip so any tap there
        // gets routed to JS (which will skip to the end card), and raise the
        // visual right strip above the card grid so right-edge taps never flip a card.
        setTimeout(() => {
            if (!isPlaying) return;
            setRightNavZoneEnabled(false);
            skipStripRight.classList.add('active');
        }, SKIP_TO_END_THRESHOLD_MS);
        const deck = [...menuItems, ...menuItems].sort(() => Math.random() - 0.5);
        boardElement.innerHTML = '';
        deck.forEach(item => {
            const cardEl = document.createElement('div');
            cardEl.classList.add('card');
            cardEl.dataset.id = item.id;
            const frontContent = item.imgSrc
                ? `<img class="card-img" src="${item.imgSrc}" alt="">`
                : `<div style="font-size:clamp(40px,14vmin,70px)">${item.emoji}</div>`;
            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <div class="match-badge"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.99774 13C5.74455 13 5.48469 12.9 5.29147 12.7067L1.62687 9.04C1.23375 8.64667 1.23375 8.01333 1.62687 7.62667C2.01998 7.24 2.65295 7.23333 3.0394 7.62667L5.76454 10.3533C5.89779 10.4867 6.10434 10.4867 6.2376 10.3533L12.9605 3.62667C13.3536 3.23333 13.9866 3.23333 14.373 3.62667C14.7595 4.02 14.7661 4.65333 14.373 5.04L6.71067 12.7067C6.51745 12.9 6.25759 13 6.0044 13H5.99774Z" fill="white"/></svg></div>
                        ${frontContent}
                        <div class="card-name">${item.name}</div>
                    </div>
                </div>`;
            cardEl.addEventListener('click', flipCard);
            boardElement.appendChild(cardEl);
        });
    }

    function flipCard() {
        if (lockBoard || this === firstCard) return;
        this.classList.add('flipped');
        if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; }
        secondCard = this;
        firstCard.dataset.id === secondCard.dataset.id ? disableCards() : unflipCards();
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard); secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched'); secondCard.classList.add('matched');
        matchesFound++; scoreTextEl.innerText = `${matchesFound}/3`;
        resetBoard();
        if (matchesFound === 3) {
            isPlaying = false;
            setTimeout(showResult, 800);
        }
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => { firstCard.classList.remove('flipped'); secondCard.classList.remove('flipped'); resetBoard(); }, 1000);
    }

    function resetBoard() { [hasFlippedCard, lockBoard] = [false, false]; [firstCard, secondCard] = [null, null]; }

    function showResult() {
        skipStripRight.classList.remove('active');
        setLeftNavZoneEnabled(false);
        setRightNavZoneEnabled(true);
        generateConfetti();
        setTimeout(() => { screenResult.classList.add('active'); }, 300);
    }

    function resetGame() {
        isPlaying = false;
        setLeftNavZoneEnabled(true);
        setRightNavZoneEnabled(true);
        screenResult.classList.remove('active');
        document.querySelectorAll('.confetti').forEach(el => el.remove());
        initGame();
    }

    function generateConfetti() {
        const confEmojis = ['✨','🏷️','🎀','🌹','👜','💍'];
        const container = document.querySelector('.ad-container');
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.innerText = confEmojis[Math.floor(Math.random() * confEmojis.length)];
            const x = Math.random() * window.innerWidth;
            const size = 18 + Math.random() * 20;
            const duration = 2.5 + Math.random() * 2.5;
            const delay = Math.random() * 0.5;
            el.style.left = x + 'px';
            el.style.top = '-50px';
            el.style.fontSize = size + 'px';
            el.style.transition = `transform ${duration}s ease-in, top ${duration}s ease-in`;
            el.style.transitionDelay = delay + 's';
            container.appendChild(el);
            setTimeout(() => {
                el.style.top = (window.innerHeight + 100) + 'px';
                el.style.transform = `rotate(${Math.random() * 720 - 360}deg)`;
            }, 50);
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, (duration + delay) * 1000 + 100);
        }
    }

    function handleCTA() {
        var url = 'https://www.lulus.com';
        if (typeof mraid !== 'undefined') mraid.open(url); else window.open(url, '_blank');
    }
</script>
