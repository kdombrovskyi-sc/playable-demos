        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #7BB8DB;
            margin: 0;
            touch-action: none;
        }

        .ad-container {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #A8CDEE 0%, #C6E0F5 100%);
            overflow: hidden;
            color: #1A3B5C;
            display: flex;
            flex-direction: column;
        }

        /* Background Watermarks */
        .bg-deco-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .deco-text {
            position: absolute;
            font-weight: 900;
            font-style: italic;
        }
        .deco-text.solid {
            color: rgba(255, 255, 255, 0.25);
        }
        .deco-text.hollow {
            display: flex;
        }
        .deco-text.hollow svg text {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 58px;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 1px;
            fill: none;
            stroke: #ffffff;
            stroke-opacity: 0.28;
            stroke-width: 3;
            paint-order: stroke;
            stroke-linejoin: round;
        }

        .score-pill {
            position: absolute;
            top: clamp(60px, 15vmin, 90px);
            right: clamp(10px, 4vmin, 20px);
            z-index: 20;
            font-size: clamp(11px, 3.5vmin, 14px);
            font-weight: 700;
            background: rgba(26, 45, 65, 0.7);
            padding: clamp(4px, 1.5vmin, 6px) clamp(8px, 3vmin, 12px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.5vmin, 6px);
            opacity: 1;
            transition: opacity 0.5s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: #F2C94C;
        }

        .score-pill svg {
            width: 16px; height: 16px; fill: #F2C94C;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Start Screen */
        #screen-start {
            background: rgba(20, 30, 45, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 25;
            color: white;
        }

        .start-logo {
            width: clamp(60px, 20vmin, 100px);
            height: clamp(60px, 20vmin, 100px);
            background: #1A3B5C;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(14px, 5vmin, 20px);
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: clamp(8px, 3vmin, 15px);
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
            border: 3px solid #fff;
        }

        .start-title {
            font-size: clamp(20px, 6vmin, 30px);
            font-weight: 900;
            margin-bottom: clamp(3px, 1vmin, 5px);
        }

        .start-subtitle {
            font-size: clamp(14px, 4.5vmin, 18px);
            font-weight: 700;
            margin-bottom: clamp(10px, 4vmin, 20px);
        }

        .start-loading {
            font-size: clamp(11px, 3.5vmin, 14px);
            color: rgba(255,255,255,0.6);
            margin-bottom: clamp(20px, 8vmin, 40px);
        }

        .start-cart {
            width: clamp(80px, 26vmin, 130px);
            aspect-ratio: 330 / 446;
            background: var(--bag-url) center/contain no-repeat;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Game Screen */
        #screen-game {
            z-index: 5;
        }

        /* Tilt Hint */
        .tilt-hint {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 45, 65, 0.85);
            padding: clamp(8px, 3vmin, 12px) clamp(14px, 5vmin, 20px);
            border-radius: 25px;
            font-size: clamp(11px, 3.5vmin, 14px);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: clamp(6px, 2.5vmin, 10px);
            white-space: nowrap;
            opacity: 1;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 8;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* Player Bag */
        .player-basket {
            position: absolute;
            bottom: clamp(15px, 4vh, 40px);
            left: 0;
            width: 80px;
            height: 80px;
            background: var(--bag-url) center/contain no-repeat;
            z-index: 10;
            will-change: transform;
            transition: transform 150ms ease-out;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        /* Falling Items */
        .falling-item {
            position: absolute;
            top: 0;
            font-size: clamp(30px, 12vmin, 55px);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            z-index: 6;
            will-change: transform;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* +1 Float Text */
        .float-text {
            position: absolute;
            font-size: clamp(20px, 7vmin, 30px);
            font-weight: 900;
            color: #F2C94C;
            text-shadow: 0 3px 6px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 11;
            animation: floatUp 0.8s ease-out forwards;
        }


        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }

        /* Result Screens (Overlay) */
        .overlay-screen {
            background: rgba(46, 46, 46, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            padding: clamp(12px, 5vmin, 20px);
            z-index: 30;
        }

        .result-heading {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.50);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .result-card {
            background: #fff;
            color: #333;
            width: 70%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .result-card:active {
            transform: scale(0.98);
        }

        .result-image {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
            background: #f0f0f0;
        }

        .result-emoji {
            font-size: clamp(80px, 28vmin, 140px);
            margin-bottom: clamp(4px, 2vmin, 10px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.1;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .result-title {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 22px;
            font-style: normal;
            font-weight: 600;
            line-height: 28px;
            letter-spacing: 0;
            color: #000;
            text-align: center;
            margin-bottom: clamp(6px, 2vmin, 10px);
        }

        .result-desc {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0;
            color: #646567;
            text-align: center;
        }

        .cta-btn {
            padding: 10px 12px 8px 10px;
            background: #FFFFFF;
            box-shadow: 0px 2px 12px rgba(0, 0, 0, 0.13);
            border: none;
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            display: inline-flex;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .cta-btn-inner {
            justify-content: center;
            align-items: center;
            gap: 8px;
            display: inline-flex;
        }

        .cta-btn .icon-wrap {
            width: 24px;
            height: 24px;
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-2px);
        }
        .cta-btn .icon-wrap svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .cta-btn-text {
            justify-content: center;
            display: flex;
            flex-direction: column;
            color: #000;
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 28px;
            word-wrap: break-word;
            text-shadow: 0px 2px 20px rgba(79, 20, 20, 0.25);
        }

        .cta-btn:active {
            background: #EEEEEE;
        }

        .play-again-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 100px;
            padding: clamp(8px, 2.5vmin, 12px) clamp(18px, 5.5vmin, 26px);
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 600;
            line-height: 20px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: clamp(5px, 1.5vmin, 7px);
            transition: all 0.2s;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.13);
        }

        .play-again-btn:active {
            color: white;
        }


        /* Confetti */
        .confetti {
            position: absolute;
            pointer-events: none;
            z-index: 29;
        }
    </style>
</head>
<body>

<div class="ad-container" id="game-container">

    <!-- Background Watermarks -->
    <div class="bg-deco-container">
        <div class="deco-text hollow" style="top: 12%; left: -3%; transform: rotate(-10deg);"><svg viewBox="0 0 200 60" width="220" height="66"><text x="5" y="50">AERO</text></svg></div>
        <div class="deco-text solid" style="top: 38%; right: -8%; font-size: 3.5rem; transform: rotate(12deg);">AERO</div>
        <div class="deco-text hollow" style="bottom: 22%; right: 5%; transform: rotate(-8deg);"><svg viewBox="0 0 200 60" width="240" height="72"><text x="5" y="50">AERO</text></svg></div>
        <div class="deco-text solid" style="bottom: 55%; left: 30%; font-size: 3rem; transform: rotate(5deg);">AERO</div>
    </div>

    <div class="score-pill" id="score-pill">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="score-text">0/6</span>
    </div>

    <!-- Start Screen Overlay -->
    <div id="screen-start" class="screen active">
        <div class="start-logo">AERO</div>
        <h2 class="start-title">Aeropostale</h2>
        <p class="start-subtitle">Catch items, win BOGO!</p>
        <p class="start-loading">Get ready to play...</p>
        <div class="start-cart" aria-hidden="true"></div>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">
        <div class="tilt-hint" id="tilt-hint">📱 Tilt your phone to catch items!</div>
        <div class="player-basket" id="player" aria-hidden="true"></div>
    </div>

    <!-- Win Screen -->
    <div id="screen-win" class="screen overlay-screen">
        <div class="result-heading" id="result-heading">YOU WON!</div>
        <div class="result-card" onclick="handleCTA()" role="button" tabindex="0">
            <img class="result-image" id="reward-img" src="https://kdombrovskyi-sc.github.io/playable-demos/reward.png" alt="BOGO Reward">
            <h2 class="result-title">BOGO JEANS & SHORTS 👖👖</h2>
            <p class="result-desc">You've unlocked a special<br>discount from Aeropostale!</p>
        </div>
        <button class="cta-btn" onclick="handleCTA()">
            <span class="cta-btn-inner">
                <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none"><path fill="#0894FA" d="M13.05 3.53a5.26 5.26 0 0 1 7.42 0v-.01a5.26 5.26 0 0 1 0 7.42l-3.52 3.51a5.26 5.26 0 0 1-7.72-.32 1 1 0 0 1 .12-1.41 1 1 0 0 1 1.4.12l.2.2a3.26 3.26 0 0 0 4.6 0l3.5-3.51a3.26 3.26 0 0 0 0-4.59 3.26 3.26 0 0 0-4.59 0L12.7 6.7a1 1 0 0 1-1.41-1.41z"/><path fill="#0894FA" d="m9.53 19.04 1.78-1.75a1 1 0 0 1 1.41 1.41l-1.76 1.76a5.23 5.23 0 0 1-7.43 0 5.26 5.26 0 0 1 0-7.42l3.52-3.51a5.26 5.26 0 0 1 7.71.32 1 1 0 0 1-.12 1.41 1 1 0 0 1-1.4-.12l-.2-.2a3.26 3.26 0 0 0-4.6 0l-3.5 3.51a3.26 3.26 0 0 0 0 4.59 3.26 3.26 0 0 0 4.59 0"/></svg></span>
                <span class="cta-btn-text">Shop BOGO Now</span>
            </span>
        </button>
        <button class="play-again-btn" onclick="resetGame()"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.00008 2.00001C2.00008 1.63334 1.70008 1.33334 1.33341 1.33334C0.966748 1.33334 0.666748 1.63334 0.666748 2.00001V6.67334C0.666748 7.04001 0.966748 7.34001 1.33341 7.34001H5.99341C6.36008 7.34001 6.66008 7.04001 6.66008 6.67334C6.66008 6.30668 6.36008 6.00668 5.99341 6.00668H3.04675C3.84675 4.00668 5.77342 2.67334 7.99341 2.67334C10.9334 2.67334 13.3267 5.06668 13.3267 8.00668C13.3267 10.9467 10.9334 13.34 7.99341 13.34C5.98008 13.34 4.16675 12.2 3.26008 10.3733C3.10008 10.0467 2.70008 9.90668 2.36675 10.0733C2.04008 10.24 1.90008 10.6333 2.06675 10.9667C3.20675 13.2467 5.48008 14.6667 8.00008 14.6667C11.6734 14.6667 14.6667 11.6733 14.6667 8.00001C14.6667 4.32668 11.6734 1.33334 8.00008 1.33334C5.38008 1.33334 3.08675 2.82668 2.00008 5.09334V2.00001Z" fill="#B0B1B2"/></svg> Play Again</button>
    </div>


</div>

<script>
    // Game Configuration
    const TARGET_SCORE = 6;
    const GOOD_ITEMS = ['👖', '👗', '🩳', '👕', '🎁'];

    let score = 0;
    let isPlaying = false;
    let isPaused = false;
    let gameLoop;
    let spawnInterval;
    let activeItems = [];
    let gameStartTime = 0;
    let spawnIndex = 0;
    const SKIP_TO_END_THRESHOLD_MS = 1000;

    function setLeftNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setLeftNavZoneEnabled === 'function') {
            ScPlayableAd.setLeftNavZoneEnabled(enabled);
        }
    }
    function setRightNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setRightNavZoneEnabled === 'function') {
            ScPlayableAd.setRightNavZoneEnabled(enabled);
        }
    }

    // DOM Elements
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenWin = document.getElementById('screen-win');
    const scoreText = document.getElementById('score-text');
    const tiltHint = document.getElementById('tilt-hint');
    const resultHeading = document.getElementById('result-heading');

    // End-card left-edge tap restarts the game. The native nav layer leaves the left 15%
    // strip pageable until triggerWin() disables it, after which all left-strip taps land
    // on the win overlay's backdrop (the centered card/buttons aren't in that strip), so
    // here we treat a backdrop tap in the left zone as "Play Again".
    screenWin.addEventListener('click', (e) => {
        if (e.target !== screenWin) return;
        if (e.clientX >= window.innerWidth * 0.15) return;
        resetGame();
    });

    // Player Configuration
    let playerX = container.clientWidth / 2;
    let targetX = playerX;
    let smoothedTilt = 0;
    let _deviceGamma = null;
    const TILT_CLAMP = 0.5;
    const TILT_SMOOTHING = 0.08;

    function getPlayerWidth() {
        return Math.max(50, container.clientWidth * 0.2);
    }
    function getHeightScale() {
        return container.clientHeight / 750;
    }

    player.style.transform = `translateX(${playerX}px) translateX(-50%)`;

    function beginCountdown() {
        setTimeout(() => {
            screenStart.classList.remove('active');
            screenGame.classList.add('active');

            setTimeout(() => {
                setupControls();
                startGame();

                setTimeout(() => {
                    tiltHint.style.opacity = '0';
                }, 3500);
            }, 300);
        }, 700);
    }

    // MRAID Integration
    let hasStarted = false;

    function tryStart() {
        if (hasStarted) return;
        hasStarted = true;
        beginCountdown();
    }

    function onViewable(viewable) {
        if (viewable) {
            if (!hasStarted) {
                tryStart();
            } else {
                resumeGame();
            }
        } else {
            pauseGame();
        }
    }

    if (typeof mraid !== 'undefined') {
        mraid.addEventListener('viewableChange', onViewable);

        if (mraid.getState() !== 'loading' && mraid.isViewable()) {
            tryStart();
        }

        mraid.addEventListener('ready', function () {
            if (mraid.isViewable()) {
                tryStart();
            }
        });
    } else {
        beginCountdown();
    }

    function startGame() {
        score = 0;
        spawnIndex = 0;
        updateScoreUI();
        isPlaying = true;
        gameStartTime = Date.now();

        activeItems.forEach(item => item.el.remove());
        activeItems = [];

        spawnInterval = setInterval(spawnItem, 800);
        gameLoop = requestAnimationFrame(update);

        // Mirror the maybeSkipToEnd grace window: until 1s elapses any tap is a no-op,
        // so leave the right nav strip pageable. After that, taps anywhere skip to the
        // end card, so the right strip needs to capture them for the WebView.
        setTimeout(() => {
            if (isPlaying) setRightNavZoneEnabled(false);
        }, SKIP_TO_END_THRESHOLD_MS);
    }

    function spawnItem() {
        if (!isPlaying) return;

        const emoji = GOOD_ITEMS[spawnIndex % GOOD_ITEMS.length];
        spawnIndex++;

        const itemEl = document.createElement('div');
        itemEl.classList.add('falling-item');
        itemEl.innerText = emoji;

        const cw = container.clientWidth;
        const itemWidth = Math.max(30, cw * 0.1125);
        const startX = Math.random() * (cw - itemWidth);
        itemEl.style.left = `${startX}px`;
        itemEl.style.transform = `translateY(-60px)`;

        screenGame.appendChild(itemEl);

        activeItems.push({
            el: itemEl,
            y: -60,
            x: startX,
            speed: (3 + Math.random() * 3) * getHeightScale(),
            type: 'good'
        });
    }

    function update() {
        if (!isPlaying || isPaused) return;

        let rawTilt = null;
        const accel = window._nativeAccel;
        if (accel && typeof accel.x === 'number') {
            rawTilt = Math.max(-1, Math.min(1, accel.x / TILT_CLAMP));
        } else if (_deviceGamma !== null) {
            rawTilt = Math.max(-1, Math.min(1, _deviceGamma / 30));
        }
        if (rawTilt !== null) {
            smoothedTilt += (rawTilt - smoothedTilt) * TILT_SMOOTHING;
            const cw = container.clientWidth;
            const pw = getPlayerWidth();
            let newX = (cw / 2) + smoothedTilt * (cw / 2);
            targetX = Math.max(pw / 2, Math.min(cw - pw / 2, newX));
        }

        player.style.transform = `translateX(${Math.round(targetX)}px) translateX(-50%)`;

        const playerRect = player.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();

        for (let i = activeItems.length - 1; i >= 0; i--) {
            let item = activeItems[i];

            item.y += item.speed;
            item.el.style.transform = `translateY(${item.y}px)`;

            const itemRect = item.el.getBoundingClientRect();

            const catchZoneTop = playerRect.top + playerRect.height * 0.3;

            if (
                itemRect.left < playerRect.right &&
                itemRect.right > playerRect.left &&
                itemRect.bottom > catchZoneTop &&
                itemRect.top < playerRect.bottom
            ) {
                handleCatch(item, i);
                continue;
            }

            if (item.y > containerRect.height) {
                item.el.remove();
                activeItems.splice(i, 1);
            }
        }

        if (isPlaying) {
            gameLoop = requestAnimationFrame(update);
        }
    }

    function handleCatch(item, index) {
        score++;
        showFloatText('+1', item.x, player.offsetTop - container.clientHeight * 0.05, false);
        updateScoreUI();

        item.el.remove();
        activeItems.splice(index, 1);

        if (score >= TARGET_SCORE) {
            triggerWin();
        }
    }

    function showFloatText(text, x, y, isNegative) {
        const floatEl = document.createElement('div');
        floatEl.classList.add('float-text');
        if (isNegative) floatEl.classList.add('negative');
        floatEl.innerText = text;
        floatEl.style.left = `${x}px`;
        floatEl.style.top = `${y}px`;
        screenGame.appendChild(floatEl);

        setTimeout(() => {
            floatEl.remove();
        }, 800);
    }

    function updateScoreUI() {
        scoreText.innerText = `${score}/${TARGET_SCORE}`;
    }

    function pauseGame() {
        if (!isPlaying || isPaused) return;
        isPaused = true;
        cancelAnimationFrame(gameLoop);
        clearInterval(spawnInterval);
    }

    function resumeGame() {
        if (!isPlaying || !isPaused) return;
        isPaused = false;
        spawnInterval = setInterval(spawnItem, 800);
        gameLoop = requestAnimationFrame(update);
    }

    function stopEngine() {
        isPlaying = false;
        isPaused = false;
        cancelAnimationFrame(gameLoop);
        clearInterval(spawnInterval);
    }

    function triggerWin() {
        const didWin = score >= TARGET_SCORE;
        resultHeading.innerText = didWin ? 'YOU WON!' : 'Thanks for playing!';
        stopEngine();
        // End card: CTA / "Play Again" sit near the bottom-center; protect the left edge
        // from accidental swipe-back, but keep the right strip pageable so users can still
        // skip forward.
        setLeftNavZoneEnabled(false);
        setRightNavZoneEnabled(true);
        generateConfetti();
        setTimeout(() => {
            screenWin.classList.add('active');
        }, 300);
    }


    function resetGame() {
        // Restore the intro-state nav zones; startGame() will re-schedule the right-zone
        // disable after the 1-sec grace window.
        setLeftNavZoneEnabled(true);
        setRightNavZoneEnabled(true);
        screenWin.classList.remove('active');

        // Remove confetti
        document.querySelectorAll('.confetti').forEach(el => el.remove());

        tiltHint.style.opacity = '1';
        setTimeout(() => {
            tiltHint.style.opacity = '0';
        }, 3000);

        startGame();
    }

    function generateConfetti() {
        const confEmojis = ['🎊','🎉','✨','👖','👗','👟'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.innerText = confEmojis[Math.floor(Math.random() * confEmojis.length)];

            const x = Math.random() * window.innerWidth;
            const size = 18 + Math.random() * 20;
            const duration = 2.5 + Math.random() * 2.5;
            const delay = Math.random() * 0.5;

            el.style.left = x + 'px';
            el.style.top = '-50px';
            el.style.fontSize = size + 'px';
            el.style.transition = `transform ${duration}s ease-in, top ${duration}s ease-in`;
            el.style.transitionDelay = delay + 's';

            container.appendChild(el);

            setTimeout(() => {
                el.style.top = (window.innerHeight + 100) + 'px';
                el.style.transform = `rotate(${Math.random() * 720 - 360}deg)`;
            }, 50);

            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, (duration + delay) * 1000 + 100);
        }
    }

    // --- INPUT CONTROLS --- //
    function handleCTA() {
        var url = 'https://www.aeropostale.com';
        if (typeof mraid !== 'undefined') {
            mraid.open(url);
        } else {
            window.open(url, '_blank');
        }
    }

    function setupControls() {
        const updatePlayerX = (clientX) => {
            const containerRect = container.getBoundingClientRect();
            const pw = getPlayerWidth();
            let x = clientX - containerRect.left;

            if (x < pw / 2) x = pw / 2;
            if (x > containerRect.width - pw / 2) x = containerRect.width - pw / 2;

            targetX = x;
            playerX = x;
        };

        const TAP_MAX_MOVE_PX = 10;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;

        const maybeSkipToEnd = () => {
            if (!isPlaying) return false;
            if (score >= TARGET_SCORE) return false;
            if (Date.now() - gameStartTime < SKIP_TO_END_THRESHOLD_MS) return false;
            triggerWin();
            return true;
        };

        container.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchMoved = false;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if(!isPlaying) return;
            e.preventDefault();
            const t = e.touches[0];
            if (Math.abs(t.clientX - touchStartX) > TAP_MAX_MOVE_PX ||
                Math.abs(t.clientY - touchStartY) > TAP_MAX_MOVE_PX) {
                touchMoved = true;
            }
            updatePlayerX(t.clientX);
        }, { passive: false });

        container.addEventListener('touchend', () => {
            if (!touchMoved) maybeSkipToEnd();
        });

        let isMouseDown = false;
        let mouseDownX = 0;
        let mouseDownY = 0;
        let mouseMoved = false;
        container.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            mouseDownX = e.clientX;
            mouseDownY = e.clientY;
            mouseMoved = false;
            updatePlayerX(e.clientX);
        });
        window.addEventListener('mouseup', () => {
            if (isMouseDown && !mouseMoved) maybeSkipToEnd();
            isMouseDown = false;
        });
        container.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                if (Math.abs(e.clientX - mouseDownX) > TAP_MAX_MOVE_PX ||
                    Math.abs(e.clientY - mouseDownY) > TAP_MAX_MOVE_PX) {
                    mouseMoved = true;
                }
                if (isPlaying) updatePlayerX(e.clientX);
            }
        });

        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null) _deviceGamma = e.gamma;
        });
    }
</script>

</body>
