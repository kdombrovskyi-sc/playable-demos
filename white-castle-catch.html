        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--wc-cream);
            margin: 0;
            touch-action: none;
        }

        .ad-container {
            position: fixed;
            inset: 0;
            background: linear-gradient(165deg, #ffffff 0%, var(--wc-cream) 45%, #ffe9cc 100%);
            overflow: hidden;
            color: var(--wc-navy);
            display: flex;
            flex-direction: column;
        }

        /* Background Watermarks */
        .bg-deco-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .deco-text {
            position: absolute;
            font-weight: 900;
            font-style: italic;
        }
        .deco-text.solid {
            color: rgba(242, 139, 0, 0.14);
        }
        .deco-text.hollow {
            display: flex;
        }
        .deco-text.hollow svg {
            overflow: visible;
            max-width: min(280px, 78vw);
            height: auto;
        }
        .deco-text.hollow svg text {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 58px;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 1px;
            fill: none;
            stroke: var(--wc-orange);
            stroke-opacity: 0.22;
            stroke-width: 3;
            paint-order: stroke;
            stroke-linejoin: round;
        }

        .score-pill {
            position: absolute;
            top: clamp(60px, 15vmin, 90px);
            right: clamp(10px, 4vmin, 20px);
            z-index: 20;
            font-size: clamp(11px, 3.5vmin, 14px);
            font-weight: 700;
            background: var(--wc-navy);
            padding: clamp(4px, 1.5vmin, 6px) clamp(8px, 3vmin, 12px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.5vmin, 6px);
            opacity: 1;
            transition: opacity 0.5s;
            box-shadow: 0 4px 10px rgba(15, 42, 71, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--wc-gold);
        }

        .score-pill svg {
            width: 16px; height: 16px; fill: var(--wc-gold);
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Start Screen */
        #screen-start {
            background: rgba(15, 42, 71, 0.92);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 25;
            color: white;
        }

        .start-logo {
            width: clamp(160px, 52vmin, 260px);
            aspect-ratio: 342 / 292;
            margin-bottom: clamp(10px, 3vmin, 18px);
            background: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35));
        }

        .start-title {
            font-size: clamp(20px, 6vmin, 30px);
            font-weight: 900;
            margin-bottom: clamp(3px, 1vmin, 5px);
        }

        .start-subtitle {
            font-size: clamp(14px, 4.5vmin, 18px);
            font-weight: 700;
            margin-bottom: clamp(10px, 4vmin, 20px);
        }

        .start-loading {
            font-size: clamp(11px, 3.5vmin, 14px);
            color: rgba(255,255,255,0.6);
            margin-bottom: clamp(20px, 8vmin, 40px);
        }

        .start-cart {
            width: clamp(57px, 18.14vmin, 91px);
            aspect-ratio: 261 / 279;
            background: var(--catcher-url) center/contain no-repeat;
            filter: drop-shadow(0 8px 14px rgba(15, 42, 71, 0.35));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Game Screen */
        #screen-game {
            z-index: 5;
        }

        /* Tilt Hint */
        .tilt-hint {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--wc-navy);
            padding: clamp(8px, 3vmin, 12px) clamp(14px, 5vmin, 20px);
            border-radius: 25px;
            font-size: clamp(11px, 3.5vmin, 14px);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: clamp(6px, 2.5vmin, 10px);
            white-space: nowrap;
            opacity: 1;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 8;
            color: white;
            box-shadow: 0 4px 15px rgba(15, 42, 71, 0.25);
            border: 2px solid var(--wc-orange);
        }

        /* Player catcher — White Castle slider box */
        .player-basket {
            position: absolute;
            bottom: clamp(15px, 4vh, 40px);
            left: 0;
            width: clamp(57px, 18.14vmin, 91px);
            aspect-ratio: 261 / 279;
            background: var(--catcher-url) center/contain no-repeat;
            z-index: 10;
            will-change: transform;
            transition: transform 150ms ease-out;
            filter: drop-shadow(0 8px 14px rgba(15, 42, 71, 0.4));
        }

        /* Falling Items */
        .falling-item {
            position: absolute;
            top: 0;
            font-size: clamp(30px, 12vmin, 55px);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            z-index: 6;
            will-change: transform;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* +1 Float Text */
        .float-text {
            position: absolute;
            font-size: clamp(20px, 7vmin, 30px);
            font-weight: 900;
            color: var(--wc-orange);
            text-shadow: 0 3px 6px rgba(15, 42, 71, 0.45);
            pointer-events: none;
            z-index: 11;
            animation: floatUp 0.8s ease-out forwards;
        }


        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }

        /* Result Screens (Overlay) */
        .overlay-screen {
            background: rgba(15, 42, 71, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            padding: clamp(12px, 5vmin, 20px);
            z-index: 30;
        }

        .result-heading {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.50);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .result-card {
            background: #fff;
            color: #333;
            width: 70%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 42, 71, 0.35);
            border-top: 4px solid var(--wc-orange);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .result-card:active {
            transform: scale(0.98);
        }

        .result-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            object-fit: cover;
            object-position: center 35%;
            margin-bottom: 16px;
            background: #f0f0f0;
        }

        .result-emoji {
            font-size: clamp(80px, 28vmin, 140px);
            margin-bottom: clamp(4px, 2vmin, 10px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.1;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .result-title {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 22px;
            font-style: normal;
            font-weight: 600;
            line-height: 28px;
            letter-spacing: 0;
            color: #000;
            text-align: center;
            margin-bottom: clamp(6px, 2vmin, 10px);
        }

        .result-desc {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0;
            color: #646567;
            text-align: center;
        }

        .cta-btn {
            padding: 10px 12px 8px 10px;
            background: #FFFFFF;
            box-shadow: 0px 2px 12px rgba(0, 0, 0, 0.13);
            border: none;
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            display: inline-flex;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .cta-btn-inner {
            justify-content: center;
            align-items: center;
            gap: 8px;
            display: inline-flex;
        }

        .cta-btn .icon-wrap {
            width: 24px;
            height: 24px;
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-2px);
        }
        .cta-btn .icon-wrap svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .cta-btn-text {
            justify-content: center;
            display: flex;
            flex-direction: column;
            color: #000;
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 28px;
            word-wrap: break-word;
            text-shadow: 0px 2px 20px rgba(79, 20, 20, 0.25);
        }

        .cta-btn:active {
            background: #EEEEEE;
        }

        .play-again-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 100px;
            padding: clamp(8px, 2.5vmin, 12px) clamp(18px, 5.5vmin, 26px);
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 600;
            line-height: 20px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: clamp(5px, 1.5vmin, 7px);
            transition: all 0.2s;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.13);
        }

        .play-again-btn:active {
            color: white;
        }


        /* Confetti */
        .confetti {
            position: absolute;
            pointer-events: none;
            z-index: 29;
        }
    </style>
</head>

    // ----- Audio -----
    // Ported from InteractiveAdProto/AeropostaleGameView.swift (AeroMusicState +

    const AeroAudio = (() => {
        let ctx = null;
        let musicGain = null;
        let padGain = null;
        let padOscs = [];
        let padLFO = null;
        let scheduler = null;
        let nextNoteTime = 0;

        let muted = false;

        let pendingMusic = false;
        let resumeWired = false;

        // C-major bouncy-pop arpeggio (notes[]) and 0.14s per note from AeroMusicState.
        const NOTES = [
            523.25, 659.25, 783.99, 880.00, 783.99,
            659.25, 783.99, 880.00, 1046.50, 880.00,
            783.99, 659.25, 523.25, 659.25, 783.99, 659.25
        ];
        const NOTE_LEN = 0.14;

        function ensureCtx() {
            if (!ctx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                ctx = new C();

        function drainPending() {
            if (!ctx || ctx.state !== 'running') return;
            if (pendingMusic) {

                startMusic();

        function scheduleNote(freq, when) {
            const dur = NOTE_LEN;
            // Fundamental sine, exponential decay (Swift: env = exp(-np*4))
            const osc1 = ctx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.value = freq;
            const g1 = ctx.createGain();
            g1.gain.setValueAtTime(0.0001, when);
            g1.gain.exponentialRampToValueAtTime(0.18, when + 0.005);
            g1.gain.exponentialRampToValueAtTime(0.0008, when + dur * 0.95);

            osc1.stop(when + dur);

            g2.gain.exponentialRampToValueAtTime(0.04, when + 0.005);

            osc2.start(when);
            osc2.stop(when + dur);

            if (muted) return;
            const c = ensureCtx();
            if (!c || scheduler) return;
            // Autoplay-policy guard: if the context isn't actually running yet
            // (e.g. game auto-started via MRAID before any user gesture), defer
            // until the first tap/click resumes it. Otherwise notes get scheduled
            // against a frozen currentTime and nothing is heard the first round.
            if (c.state !== 'running') {
                pendingMusic = true;
                return;
            }

            // 1-second fade-in (Swift: fadeIn = min(1, t/1))
            musicGain = c.createGain();
            musicGain.gain.setValueAtTime(0, c.currentTime);
            musicGain.gain.linearRampToValueAtTime(0.9, c.currentTime + 1.0);
            musicGain.connect(c.destination);

            // Sustained C-major triad pad (C4/E4/G4) with LFO swell
            padGain = c.createGain();
            padGain.gain.value = 0.06;
            padGain.connect(musicGain);

            const lfo = c.createOscillator();
            lfo.frequency.value = 2.0;
            const lfoGain = c.createGain();
            lfoGain.gain.value = 0.015;
            lfo.connect(lfoGain);
            lfoGain.connect(padGain.gain);
            lfo.start();
            padLFO = lfo;

            const padFreqs = [261.63, 329.63, 392.00];
            const padLevels = [1.0, 0.7, 0.5];
            padOscs = padFreqs.map((f, i) => {
                const osc = c.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = f;
                const g = c.createGain();
                g.gain.value = padLevels[i] * 0.4;
                osc.connect(g);
                g.connect(padGain);
                osc.start();
                return { osc, g };
            });

            // Lookahead scheduler (50ms tick, 200ms lookahead)
            nextNoteTime = c.currentTime + 0.05;
            noteIndex = 0;
            const tick = () => {
                if (!scheduler || !ctx) return;
                while (nextNoteTime < ctx.currentTime + 0.20) {
                    scheduleNote(NOTES[noteIndex % NOTES.length], nextNoteTime);
                    nextNoteTime += NOTE_LEN;
                    noteIndex++;
                }
            };
            scheduler = setInterval(tick, 50);
            tick();
        }

        function stopMusic() {
            pendingMusic = false;
            if (scheduler) { clearInterval(scheduler); scheduler = null; }
            if (!ctx) return;
            const t = ctx.currentTime;
            if (musicGain) {
                try {
                    musicGain.gain.cancelScheduledValues(t);
                    musicGain.gain.setValueAtTime(musicGain.gain.value, t);
                    musicGain.gain.linearRampToValueAtTime(0, t + 0.2);
                } catch (e) {}
            }
            const padOscsRef = padOscs;
            const padLFORef = padLFO;
            const padGainRef = padGain;
            const musicGainRef = musicGain;
            padOscs = [];
            padLFO = null;
            padGain = null;
            musicGain = null;
            setTimeout(() => {
                padOscsRef.forEach(o => { try { o.osc.stop(); } catch (e) {} });
                if (padLFORef) { try { padLFORef.stop(); } catch (e) {} }
                try { if (padGainRef) padGainRef.disconnect(); } catch (e) {}
                try { if (musicGainRef) musicGainRef.disconnect(); } catch (e) {}
            }, 260);
        }

        // SFX approximations of the iOS system sounds used in the Swift port.

        // 1057 "Tink" — short bright blip used for taps/start.
        function playTap() {
            if (muted) return;
            const c = ensureCtx(); if (!c || c.state !== 'running') return;
            const t = c.currentTime;
            const osc = c.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2200, t);
            osc.frequency.exponentialRampToValueAtTime(900, t + 0.08);
            const g = c.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.25, t + 0.005);
            g.gain.exponentialRampToValueAtTime(0.0008, t + 0.10);
            osc.connect(g).connect(c.destination);
            osc.start(t); osc.stop(t + 0.12);
        }

        // 1521 "Peek" — bright two-tone pluck used on each catch.
        function playCatch() {
            if (muted) return;
            const c = ensureCtx(); if (!c || c.state !== 'running') return;
            const t = c.currentTime;
            const layers = [
                { freq: 880,    type: 'triangle', amp: 0.30 },
                { freq: 1318.5, type: 'sine',     amp: 0.18 }
            ];
            layers.forEach(({ freq, type, amp }) => {
                const osc = c.createOscillator();
                osc.type = type;
                osc.frequency.value = freq;
                const g = c.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(amp, t + 0.005);
                g.gain.exponentialRampToValueAtTime(0.0008, t + 0.18);
                osc.connect(g).connect(c.destination);
                osc.start(t); osc.stop(t + 0.20);
            });
        }

        // 1335 "Glass" — ascending C-major arpeggio chime for the win.
        function playWin() {
            if (muted) return;
            const c = ensureCtx(); if (!c || c.state !== 'running') return;
            const t0 = c.currentTime;
            const seq = [
                { f: 523.25,  dt: 0.00, dur: 0.40 },
                { f: 659.25,  dt: 0.10, dur: 0.40 },
                { f: 783.99,  dt: 0.20, dur: 0.50 },
                { f: 1046.50, dt: 0.30, dur: 0.75 }
            ];
            seq.forEach(({ f, dt, dur }) => {
                const t = t0 + dt;
                const osc = c.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = f;
                const g = c.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(0.30, t + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
                osc.connect(g).connect(c.destination);
                osc.start(t); osc.stop(t + dur + 0.05);

                const osc2 = c.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = f * 2;
                const g2 = c.createGain();
                g2.gain.setValueAtTime(0.0001, t);
                g2.gain.exponentialRampToValueAtTime(0.10, t + 0.01);
                g2.gain.exponentialRampToValueAtTime(0.0008, t + dur * 0.7);
                osc2.connect(g2).connect(c.destination);
                osc2.start(t); osc2.stop(t + dur + 0.05);
            });
        }

        function resume() { ensureCtx(); }

        return { startMusic, stopMusic, playTap, playCatch, playWin, resume };
    })();

    // Most webviews block AudioContext until a user gesture. We can't rely on the
    // MRAID viewable callback as a gesture, so on the first real touch/click we
    // resume the context. AeroAudio.startMusic() defers if the context is still
    // suspended and is replayed automatically once it transitions to running.
    let _audioUnlocked = false;
    const _audioPrimer = () => {
        if (_audioUnlocked) return;
        _audioUnlocked = true;
        AeroAudio.resume();
        // If the game already auto-started (MRAID) before this gesture, kick the
        // music now — startMusic() will no-op until ctx is actually running, and
        // the statechange/resume handler will then drain the pending request.
        if (typeof isPlaying !== 'undefined' && isPlaying && !isPaused) {
            AeroAudio.startMusic();
        }
        window.removeEventListener('touchstart', _audioPrimer, true);
        window.removeEventListener('mousedown', _audioPrimer, true);
    };
    window.addEventListener('touchstart', _audioPrimer, true);
    window.addEventListener('mousedown', _audioPrimer, true);

    // Game Configuration
    const TARGET_SCORE = 6;
    const GOOD_ITEMS = ['🍔', '🍟', '🥤', '🧅', '🍩'];

    let score = 0;
    let isPlaying = false;
    let isPaused = false;
    let gameLoop;
    let spawnInterval;
    let activeItems = [];
    let gameStartTime = 0;
    let spawnIndex = 0;
    const SKIP_TO_END_THRESHOLD_MS = 1000;

    function setLeftNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setLeftNavZoneEnabled === 'function') {
            ScPlayableAd.setLeftNavZoneEnabled(enabled);
        }
    }
    function setRightNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setRightNavZoneEnabled === 'function') {
            ScPlayableAd.setRightNavZoneEnabled(enabled);
        }
    }

    // DOM Elements
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenWin = document.getElementById('screen-win');
    const scoreText = document.getElementById('score-text');
    const tiltHint = document.getElementById('tilt-hint');
    const resultHeading = document.getElementById('result-heading');

    // End-card left-edge tap restarts the game. The native nav layer leaves the left 15%
    // strip pageable until triggerWin() disables it, after which all left-strip taps land
    // on the win overlay's backdrop (the centered card/buttons aren't in that strip), so
    // here we treat a backdrop tap in the left zone as "Play Again".
    screenWin.addEventListener('click', (e) => {
        if (e.target !== screenWin) return;
        if (e.clientX >= window.innerWidth * 0.15) return;
        resetGame();
    });

    // Player Configuration
    let playerX = container.clientWidth / 2;
    let targetX = playerX;
    let smoothedTilt = 0;
    let _deviceGamma = null;
    const TILT_CLAMP = 0.5;
    const TILT_SMOOTHING = 0.08;

    function getPlayerWidth() {
        return player.offsetWidth || Math.max(50, container.clientWidth * 0.2);
    }
    function getHeightScale() {
        return container.clientHeight / 750;
    }

    player.style.transform = `translateX(${playerX}px) translateX(-50%)`;

    function beginCountdown() {
        setTimeout(() => {
            screenStart.classList.remove('active');
            screenGame.classList.add('active');

            setTimeout(() => {
                setupControls();
                startGame();

                setTimeout(() => {
                    tiltHint.style.opacity = '0';
                }, 3500);
            }, 300);
        }, 700);
    }

    // MRAID Integration
    let hasStarted = false;

    function tryStart() {
        if (hasStarted) return;
        hasStarted = true;
        beginCountdown();
    }

    function onViewable(viewable) {
        if (viewable) {
            if (!hasStarted) {
                tryStart();
            } else {
                resumeGame();
            }
        } else {
            pauseGame();
        }
    }

    if (typeof mraid !== 'undefined') {
        mraid.addEventListener('viewableChange', onViewable);

        if (mraid.getState() !== 'loading' && mraid.isViewable()) {
            tryStart();
        }

        mraid.addEventListener('ready', function () {
            if (mraid.isViewable()) {
                tryStart();
            }
        });
    } else {
        beginCountdown();
    }

    function startGame() {
        score = 0;
        spawnIndex = 0;
        updateScoreUI();
        isPlaying = true;
        gameStartTime = Date.now();

        activeItems.forEach(item => item.el.remove());
        activeItems = [];

        AeroAudio.playTap();
        AeroAudio.startMusic();

        spawnInterval = setInterval(spawnItem, 800);
        gameLoop = requestAnimationFrame(update);

        // Mirror the maybeSkipToEnd grace window: until 1s elapses any tap is a no-op,
        // so leave the right nav strip pageable. After that, taps anywhere skip to the
        // end card, so the right strip needs to capture them for the WebView.
        setTimeout(() => {
            if (isPlaying) setRightNavZoneEnabled(false);
        }, SKIP_TO_END_THRESHOLD_MS);
    }

    function spawnItem() {
        if (!isPlaying) return;

        const emoji = GOOD_ITEMS[spawnIndex % GOOD_ITEMS.length];
        spawnIndex++;

        const itemEl = document.createElement('div');
        itemEl.classList.add('falling-item');
        itemEl.innerText = emoji;

        const cw = container.clientWidth;
        const itemWidth = Math.max(30, cw * 0.1125);
        const startX = Math.random() * (cw - itemWidth);
        itemEl.style.left = `${startX}px`;
        itemEl.style.transform = `translateY(-60px)`;

        screenGame.appendChild(itemEl);

        activeItems.push({
            el: itemEl,
            y: -60,
            x: startX,
            speed: (3 + Math.random() * 3) * getHeightScale(),
            type: 'good'
        });
    }

    function update() {
        if (!isPlaying || isPaused) return;

        let rawTilt = null;
        const accel = window._nativeAccel;
        if (accel && typeof accel.x === 'number') {
            rawTilt = Math.max(-1, Math.min(1, accel.x / TILT_CLAMP));
        } else if (_deviceGamma !== null) {
            rawTilt = Math.max(-1, Math.min(1, _deviceGamma / 30));
        }
        if (rawTilt !== null) {
            smoothedTilt += (rawTilt - smoothedTilt) * TILT_SMOOTHING;
            const cw = container.clientWidth;
            const pw = getPlayerWidth();
            let newX = (cw / 2) + smoothedTilt * (cw / 2);
            targetX = Math.max(pw / 2, Math.min(cw - pw / 2, newX));
        }

        player.style.transform = `translateX(${Math.round(targetX)}px) translateX(-50%)`;

        const playerRect = player.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();

        for (let i = activeItems.length - 1; i >= 0; i--) {
            let item = activeItems[i];

            item.y += item.speed;
            item.el.style.transform = `translateY(${item.y}px)`;

            const itemRect = item.el.getBoundingClientRect();

            const catchZoneTop = playerRect.top + playerRect.height * 0.3;

            if (
                itemRect.left < playerRect.right &&
                itemRect.right > playerRect.left &&
                itemRect.bottom > catchZoneTop &&
                itemRect.top < playerRect.bottom
            ) {
                handleCatch(item, i);
                continue;
            }

            if (item.y > containerRect.height) {
                item.el.remove();
                activeItems.splice(i, 1);
            }
        }

        if (isPlaying) {
            gameLoop = requestAnimationFrame(update);
        }
    }

    function handleCatch(item, index) {
        score++;
        AeroAudio.playCatch();
        showFloatText('+1', item.x, player.offsetTop - container.clientHeight * 0.05, false);
        updateScoreUI();

        item.el.remove();
        activeItems.splice(index, 1);

        if (score >= TARGET_SCORE) {
            triggerWin();
        }
    }

    function showFloatText(text, x, y, isNegative) {
        const floatEl = document.createElement('div');
        floatEl.classList.add('float-text');
        if (isNegative) floatEl.classList.add('negative');
        floatEl.innerText = text;
        floatEl.style.left = `${x}px`;
        floatEl.style.top = `${y}px`;
        screenGame.appendChild(floatEl);

        setTimeout(() => {
            floatEl.remove();
        }, 800);
    }

    function updateScoreUI() {
        scoreText.innerText = `${score}/${TARGET_SCORE}`;
    }

    function pauseGame() {
        if (!isPlaying || isPaused) return;
        isPaused = true;
        cancelAnimationFrame(gameLoop);
        clearInterval(spawnInterval);
        AeroAudio.stopMusic();
    }

    function resumeGame() {
        if (!isPlaying || !isPaused) return;
        isPaused = false;
        AeroAudio.startMusic();
        spawnInterval = setInterval(spawnItem, 800);
        gameLoop = requestAnimationFrame(update);
    }

    function stopEngine() {
        isPlaying = false;
        isPaused = false;
        cancelAnimationFrame(gameLoop);
        clearInterval(spawnInterval);
        AeroAudio.stopMusic();
    }

    function triggerWin() {
        const didWin = score >= TARGET_SCORE;
        resultHeading.innerText = didWin ? 'YOU WON!' : 'Thanks for playing!';
        stopEngine();
        AeroAudio.playWin();
        // End card: CTA / "Play Again" sit near the bottom-center; protect the left edge
        // from accidental swipe-back, but keep the right strip pageable so users can still
        // skip forward.
        setLeftNavZoneEnabled(false);
        setRightNavZoneEnabled(true);
        generateConfetti();
        setTimeout(() => {
            screenWin.classList.add('active');
        }, 300);
    }


    function resetGame() {
        // Restore the intro-state nav zones; startGame() will re-schedule the right-zone
        // disable after the 1-sec grace window.
        setLeftNavZoneEnabled(true);
        setRightNavZoneEnabled(true);
        screenWin.classList.remove('active');

        // Remove confetti
        document.querySelectorAll('.confetti').forEach(el => el.remove());

        tiltHint.style.opacity = '1';
        setTimeout(() => {
            tiltHint.style.opacity = '0';
        }, 3000);

        startGame();
    }

    function generateConfetti() {
        const confEmojis = ['🎊','🎉','✨','🍔','🍟','📦'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.innerText = confEmojis[Math.floor(Math.random() * confEmojis.length)];

            const x = Math.random() * window.innerWidth;
            const size = 18 + Math.random() * 20;
            const duration = 2.5 + Math.random() * 2.5;
            const delay = Math.random() * 0.5;

            el.style.left = x + 'px';
            el.style.top = '-50px';
            el.style.fontSize = size + 'px';
            el.style.transition = `transform ${duration}s ease-in, top ${duration}s ease-in`;
            el.style.transitionDelay = delay + 's';

            container.appendChild(el);

            setTimeout(() => {
                el.style.top = (window.innerHeight + 100) + 'px';
                el.style.transform = `rotate(${Math.random() * 720 - 360}deg)`;
            }, 50);

            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, (duration + delay) * 1000 + 100);
        }
    }

    // --- INPUT CONTROLS --- //
    function handleCTA() {
        var url = 'https://www.whitecastle.com/';
        if (typeof mraid !== 'undefined') {
            mraid.open(url);
        } else {
            window.open(url, '_blank');
        }
    }

    function setupControls() {
        const updatePlayerX = (clientX) => {
            const containerRect = container.getBoundingClientRect();
            const pw = getPlayerWidth();
            let x = clientX - containerRect.left;

            if (x < pw / 2) x = pw / 2;
            if (x > containerRect.width - pw / 2) x = containerRect.width - pw / 2;

            targetX = x;
            playerX = x;
        };

        const TAP_MAX_MOVE_PX = 10;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;

        const maybeSkipToEnd = () => {
            if (!isPlaying) return false;
            if (score >= TARGET_SCORE) return false;
            if (Date.now() - gameStartTime < SKIP_TO_END_THRESHOLD_MS) return false;
            triggerWin();
            return true;
        };

        container.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchMoved = false;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if(!isPlaying) return;
            e.preventDefault();
            const t = e.touches[0];
            if (Math.abs(t.clientX - touchStartX) > TAP_MAX_MOVE_PX ||
                Math.abs(t.clientY - touchStartY) > TAP_MAX_MOVE_PX) {
                touchMoved = true;
            }
            updatePlayerX(t.clientX);
        }, { passive: false });

        container.addEventListener('touchend', () => {
            if (!touchMoved) maybeSkipToEnd();
        });

        let isMouseDown = false;
        let mouseDownX = 0;
        let mouseDownY = 0;
        let mouseMoved = false;
        container.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            mouseDownX = e.clientX;
            mouseDownY = e.clientY;
            mouseMoved = false;
            updatePlayerX(e.clientX);
        });
        window.addEventListener('mouseup', () => {
            if (isMouseDown && !mouseMoved) maybeSkipToEnd();
            isMouseDown = false;
        });
        container.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                if (Math.abs(e.clientX - mouseDownX) > TAP_MAX_MOVE_PX ||
                    Math.abs(e.clientY - mouseDownY) > TAP_MAX_MOVE_PX) {
                    mouseMoved = true;
                }
                if (isPlaying) updatePlayerX(e.clientX);
            }
        });

        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null) _deviceGamma = e.gamma;
        });
    }
</script>

</body>
</html>
