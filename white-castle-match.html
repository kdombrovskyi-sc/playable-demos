<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>White Castle - Match</title>
    <style>

        :root {
            --wc-orange: #F28B00;
            --wc-orange-dark: #C96A00;
            --wc-blue: #00339C;
            --wc-blue-light: #0060A8;
            --wc-navy: #0F2A47;
            --wc-gold: #DBCE20;
            --wc-cream: #FFF9F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--wc-cream);
            margin: 0;
            touch-action: none;
        }

        .ad-container {
            position: fixed;
            inset: 0;
            background: linear-gradient(165deg, #ffffff 0%, var(--wc-cream) 45%, #ffe9cc 100%);
            overflow: hidden;
            color: var(--wc-navy);
            display: flex;
            flex-direction: column;
        }

        .score-pill {
            position: absolute;
            top: max(clamp(60px, 15vmin, 90px), calc(env(safe-area-inset-top, 0px) + 12px));
            right: max(clamp(10px, 4vmin, 20px), env(safe-area-inset-right, 0px));
            z-index: 20;
            font-size: clamp(11px, 3.5vmin, 14px);
            font-weight: 700;
            background: var(--wc-navy);
            padding: clamp(4px, 1.5vmin, 6px) clamp(8px, 3vmin, 12px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.5vmin, 6px);
            opacity: 1;
            transition: opacity 0.5s;
            box-shadow: 0 4px 10px rgba(15, 42, 71, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--wc-gold);
        }

        .score-pill svg {
            width: 16px; height: 16px; fill: var(--wc-gold);
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Start Screen */
        #screen-start {
            background: rgba(15, 42, 71, 0.92);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 25;
            color: white;
        }

        .start-logo {
            width: clamp(140px, 46vmin, 220px);
            height: auto;
            margin-bottom: clamp(10px, 3.5vmin, 18px);
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.35));
        }

        .start-subtitle {
            font-size: clamp(14px, 4.5vmin, 18px);
            font-weight: 700;
            margin-bottom: clamp(10px, 4vmin, 20px);
        }

        .start-loading {
            font-size: clamp(11px, 3.5vmin, 14px);
            color: rgba(255,255,255,0.6);
            margin-bottom: clamp(20px, 8vmin, 40px);
        }

            50% { transform: translateY(-20px); }
        }

        /* +1 Float Text */
        .float-text {
            position: absolute;
            font-size: clamp(20px, 7vmin, 30px);
            font-weight: 900;
            color: var(--wc-orange);
            text-shadow: 0 3px 6px rgba(15, 42, 71, 0.45);
            pointer-events: none;
            z-index: 11;
            animation: floatUp 0.8s ease-out forwards;
        }


        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }

        /* Result Screens (Overlay) */
        .overlay-screen {
            background: rgba(15, 42, 71, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            padding: clamp(12px, 5vmin, 20px);
            z-index: 30;
        }

        #screen-result.overlay-screen {
            background: rgba(15, 42, 71, 0.38);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 30;
        }

        /* Keep matched tiles visible under the end card; block card taps */
        #screen-game.under-result {
            pointer-events: none;
        }

        /* Right-edge strip during gameplay: captures skip taps above the card grid */
        .skip-strip-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 15%;
            height: 100%;
            z-index: 25;
            pointer-events: none;
        }

        .skip-strip-right.active {
            pointer-events: auto;
        }

        .result-heading {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.50);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .result-card {
            background: #fff;
            color: #333;
            width: 70%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 42, 71, 0.35);
            border-top: 4px solid var(--wc-orange);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .result-card:active {
            transform: scale(0.98);
        }

        .result-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            object-fit: contain;
            object-position: center center;
            margin-bottom: 16px;
            background: linear-gradient(165deg, #ffffff 0%, var(--wc-cream) 100%);
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-emoji {
            font-size: clamp(80px, 28vmin, 140px);
            margin-bottom: clamp(4px, 2vmin, 10px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.1;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .result-title {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 22px;
            font-style: normal;
            font-weight: 600;
            line-height: 28px;
            letter-spacing: 0;
            color: #000;
            text-align: center;
            margin-bottom: clamp(6px, 2vmin, 10px);
        }

        .result-desc {
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0;
            color: #646567;
            text-align: center;
        }

        .cta-btn {
            padding: 10px 12px 8px 10px;
            background: #FFFFFF;
            box-shadow: 0px 2px 12px rgba(0, 0, 0, 0.13);
            border: none;
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            display: inline-flex;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .cta-btn-inner {
            justify-content: center;
            align-items: center;
            gap: 8px;
            display: inline-flex;
        }

        .cta-btn .icon-wrap {
            width: 24px;
            height: 24px;
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-2px);
        }
        .cta-btn .icon-wrap svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .cta-btn-text {
            justify-content: center;
            display: flex;
            flex-direction: column;
            color: #000;
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 28px;
            word-wrap: break-word;
            text-shadow: 0px 2px 20px rgba(79, 20, 20, 0.25);
        }

        .cta-btn:active {
            background: #EEEEEE;
        }

        .play-again-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 100px;
            padding: clamp(8px, 2.5vmin, 12px) clamp(18px, 5.5vmin, 26px);
            font-family: "Avenir Next", -apple-system, sans-serif;
            font-size: 14px;
            font-style: normal;
            font-weight: 600;
            line-height: 20px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: clamp(5px, 1.5vmin, 7px);
            transition: all 0.2s;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.13);
        }

        .play-again-btn:active {
            color: white;
        }


        /* Confetti — falls over the matched board (above cards, under end-card UI) */
        #screen-game .confetti {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }


        /* Game Board (memory match) */
        #screen-game {
            z-index: 5;
            box-sizing: border-box;
            padding-top: max(clamp(70px, 18vmin, 100px), calc(env(safe-area-inset-top, 0px) + 56px));
            padding-bottom: max(clamp(16px, 4vmin, 28px), env(safe-area-inset-bottom, 0px));
            padding-left: max(clamp(16px, 4.5vmin, 28px), env(safe-area-inset-left, 0px));
            padding-right: max(clamp(16px, 4.5vmin, 28px), env(safe-area-inset-right, 0px));
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(10px, 3vmin, 18px);
            /* Cap width by the available width AND the available height so the
               2x3 grid always fits the screen and the cards keep their square
               aspect ratio (don't stretch into tall rectangles on iPhone). */
            width: min(420px, 100%, calc((100vh - 170px) * 0.62));
            width: min(420px, 100%, calc((100svh - 170px) * 0.62));
            max-height: 100%;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .card {
            perspective: 1000px;
            cursor: pointer;
            width: 100%;
            min-width: 0;
            min-height: 0;
            aspect-ratio: 1 / 1.05;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(15, 42, 71, 0.2);
        }

        .card-back {
            background: #0060A9;
            border: 2px solid rgba(242, 139, 0, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-back-burger {
            width: clamp(58px, 20vmin, 82px);
            line-height: 0;
            opacity: 1;
        }

        .card-back-burger img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .card-front {
            background: #ffffff;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: var(--wc-navy);
            position: relative;
            border-top: 3px solid var(--wc-orange);
        }

        .card-image {
            flex: 1;
            width: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .card-image img {
            max-width: 92%;
            max-height: clamp(72px, 22vmin, 120px);
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 6px 10px rgba(15, 42, 71, 0.2));
        }

        .card-name {
            font-size: clamp(10px, 3vmin, 13px);
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
            color: var(--wc-navy);
        }

        .match-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            background: var(--wc-orange);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition-delay: 0.2s;
            z-index: 10;
        }

        .card.matched .match-badge {
            opacity: 1;
            transform: scale(1);
        }

    </style>
</head>
<body>

<div class="ad-container" id="game-container">

    <div class="score-pill" id="score-pill">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="score-text">0/3</span>
    </div>

    <div class="skip-strip-right" id="skip-strip-right" aria-hidden="true"></div>

    <div id="screen-start" class="screen active">
        <img class="start-logo" id="start-logo" alt="White Castle">
        <p class="start-subtitle">Match the sliders!</p>
        <p class="start-loading">Get ready to play...</p>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-board" id="board"></div>
    </div>

    <div id="screen-result" class="screen overlay-screen">
        <div class="result-heading" id="result-heading">YOU MATCHED!</div>
        <div class="result-card" onclick="handleCTA()" role="button" tabindex="0">
            <img class="result-image" id="reward-img" alt="White Castle slider">
            <h2 class="result-title">Try the new Garlic Parm Chicken Slider now for a limited time.</h2>
            <p class="result-desc">Only at White Castle.</p>
        </div>
        <button class="cta-btn" onclick="handleCTA()">
            <span class="cta-btn-inner">
                <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none"><path fill="#0894FA" d="M13.05 3.53a5.26 5.26 0 0 1 7.42 0v-.01a5.26 5.26 0 0 1 0 7.42l-3.52 3.51a5.26 5.26 0 0 1-7.72-.32 1 1 0 0 1 .12-1.41 1 1 0 0 1 1.4.12l.2.2a3.26 3.26 0 0 0 4.6 0l3.5-3.51a3.26 3.26 0 0 0 0-4.59 3.26 3.26 0 0 0-4.59 0L12.7 6.7a1 1 0 0 1-1.41-1.41z"/><path fill="#0894FA" d="m9.53 19.04 1.78-1.75a1 1 0 0 1 1.41 1.41l-1.76 1.76a5.23 5.23 0 0 1-7.43 0 5.26 5.26 0 0 1 0-7.42l3.52-3.51a5.26 5.26 0 0 1 7.71.32 1 1 0 0 1-.12 1.41 1 1 0 0 1-1.4-.12l-.2-.2a3.26 3.26 0 0 0-4.6 0l-3.5 3.51a3.26 3.26 0 0 0 0 4.59 3.26 3.26 0 0 0 4.59 0"/></svg></span>
                <span class="cta-btn-text">Order Now</span>
            </span>
        </button>
        <button class="play-again-btn" onclick="resetGame()"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.00008 2.00001C2.00008 1.63334 1.70008 1.33334 1.33341 1.33334C0.966748 1.33334 0.666748 1.63334 0.666748 2.00001V6.67334C0.666748 7.04001 0.966748 7.34001 1.33341 7.34001H5.99341C6.36008 7.34001 6.66008 7.04001 6.66008 6.67334C6.66008 6.30668 6.36008 6.00668 5.99341 6.00668H3.04675C3.84675 4.00668 5.77342 2.67334 7.99341 2.67334C10.9334 2.67334 13.3267 5.06668 13.3267 8.00668C13.3267 10.9467 10.9334 13.34 7.99341 13.34C5.98008 13.34 4.16675 12.2 3.26008 10.3733C3.10008 10.0467 2.70008 9.90668 2.36675 10.0733C2.04008 10.24 1.90008 10.6333 2.06675 10.9667C3.20675 13.2467 5.48008 14.6667 8.00008 14.6667C11.6734 14.6667 14.6667 11.6733 14.6667 8.00001C14.6667 4.32668 11.6734 1.33334 8.00008 1.33334C5.38008 1.33334 3.08675 2.82668 2.00008 5.09334V2.00001Z" fill="#B0B1B2"/></svg> Play Again</button>
    </div>


</div>

<script>
    const AeroAudio = (() => {
        let ctx = null;
        let musicGain = null;
        let padGain = null;
        let padOscs = [];
        let padLFO = null;
        let scheduler = null;
        let nextNoteTime = 0;
        let noteIndex = 0;
        let muted = false;
        // Music requested while ctx was still suspended; replay when it unlocks.
        let pendingMusic = false;
        let resumeWired = false;

        // C-major bouncy-pop arpeggio (notes[]) and 0.14s per note from AeroMusicState.
        const NOTES = [
            523.25, 659.25, 783.99, 880.00, 783.99,
            659.25, 783.99, 880.00, 1046.50, 880.00,
            783.99, 659.25, 523.25, 659.25, 783.99, 659.25
        ];
        const NOTE_LEN = 0.14;

        function ensureCtx() {
            if (!ctx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                ctx = new C();
                // Some webviews fire 'statechange' instead of resolving resume();
                // either path drains pendingMusic.
                if (!resumeWired) {
                    resumeWired = true;
                    ctx.addEventListener && ctx.addEventListener('statechange', drainPending);
                }
            }
            if (ctx.state === 'suspended') {
                const p = ctx.resume();
                if (p && typeof p.then === 'function') p.then(drainPending).catch(() => {});
            }
            return ctx;
        }

        function drainPending() {
            if (!ctx || ctx.state !== 'running') return;
            if (pendingMusic) {
                pendingMusic = false;
                startMusic();
            }
        }

        function scheduleNote(freq, when) {
            const dur = NOTE_LEN;
            // Fundamental sine, exponential decay (Swift: env = exp(-np*4))
            const osc1 = ctx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.value = freq;
            const g1 = ctx.createGain();
            g1.gain.setValueAtTime(0.0001, when);
            g1.gain.exponentialRampToValueAtTime(0.18, when + 0.005);
            g1.gain.exponentialRampToValueAtTime(0.0008, when + dur * 0.95);
            osc1.connect(g1).connect(musicGain);
            osc1.start(when);
            osc1.stop(when + dur);

            // Octave overtone (Swift: oct = sin(phase2*2π) * 0.2)
            const osc2 = ctx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.value = freq * 2;
            const g2 = ctx.createGain();
            g2.gain.setValueAtTime(0.0001, when);
            g2.gain.exponentialRampToValueAtTime(0.04, when + 0.005);
            g2.gain.exponentialRampToValueAtTime(0.0006, when + dur * 0.95);
            osc2.connect(g2).connect(musicGain);
            osc2.start(when);
            osc2.stop(when + dur);
        }

        function startMusic() {
            if (muted) return;
            const c = ensureCtx();
            if (!c || scheduler) return;
            // Autoplay-policy guard: if the context isn't actually running yet
            // (e.g. game auto-started via MRAID before any user gesture), defer
            // until the first tap/click resumes it. Otherwise notes get scheduled
            // against a frozen currentTime and nothing is heard the first round.
            if (c.state !== 'running') {
                pendingMusic = true;
                return;
            }

            // 1-second fade-in (Swift: fadeIn = min(1, t/1))
            musicGain = c.createGain();
            musicGain.gain.setValueAtTime(0, c.currentTime);
            musicGain.gain.linearRampToValueAtTime(0.9, c.currentTime + 1.0);
            musicGain.connect(c.destination);

            // Sustained C-major triad pad (C4/E4/G4) with LFO swell
            padGain = c.createGain();
            padGain.gain.value = 0.06;
            padGain.connect(musicGain);

            const lfo = c.createOscillator();
            lfo.frequency.value = 2.0;
            const lfoGain = c.createGain();
            lfoGain.gain.value = 0.015;
            lfo.connect(lfoGain);
            lfoGain.connect(padGain.gain);
            lfo.start();
            padLFO = lfo;

            const padFreqs = [261.63, 329.63, 392.00];
            const padLevels = [1.0, 0.7, 0.5];
            padOscs = padFreqs.map((f, i) => {
                const osc = c.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = f;
                const g = c.createGain();
                g.gain.value = padLevels[i] * 0.4;
                osc.connect(g);
                g.connect(padGain);
                osc.start();
                return { osc, g };
            });

            // Lookahead scheduler (50ms tick, 200ms lookahead)
            nextNoteTime = c.currentTime + 0.05;
            noteIndex = 0;
            const tick = () => {
                if (!scheduler || !ctx) return;
                while (nextNoteTime < ctx.currentTime + 0.20) {
                    scheduleNote(NOTES[noteIndex % NOTES.length], nextNoteTime);
                    nextNoteTime += NOTE_LEN;
                    noteIndex++;
                }
            };
            scheduler = setInterval(tick, 50);
            tick();
        }

        function stopMusic() {
            pendingMusic = false;
            if (scheduler) { clearInterval(scheduler); scheduler = null; }
            if (!ctx) return;
            const t = ctx.currentTime;
            if (musicGain) {
                try {
                    musicGain.gain.cancelScheduledValues(t);
                    musicGain.gain.setValueAtTime(musicGain.gain.value, t);
                    musicGain.gain.linearRampToValueAtTime(0, t + 0.2);
                } catch (e) {}
            }
            const padOscsRef = padOscs;
            const padLFORef = padLFO;
            const padGainRef = padGain;
            const musicGainRef = musicGain;
            padOscs = [];
            padLFO = null;
            padGain = null;
            musicGain = null;
            setTimeout(() => {

    const MENU_ITEMS = [
        { id: 'original', name: 'Original Slider', image: SLIDER_IMAGE_ORIGINAL },
        { id: 'garlic-parm', name: 'Garlic Parm Slider', image: SLIDER_IMAGE_GARLIC_PARM },
        { id: 'chicken-ring', name: 'Chicken Ring Slider', image: SLIDER_IMAGE_CHICKEN_RING },
    ];

    const TOTAL_PAIRS = 3;

    let cards = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let matchesFound = 0;
    let hasStarted = false;
    let isPlaying = false;
    let gameStartTime = 0;
    const SKIP_TO_END_THRESHOLD_MS = 1000;

    const startLogo = document.getElementById('start-logo');
    const rewardImg = document.getElementById('reward-img');
    startLogo.src = START_LOGO_IMAGE;
    rewardImg.src = SLIDER_IMAGE_GARLIC_PARM;

    const boardElement = document.getElementById('board');
    const scoreTextElement = document.getElementById('score-text');
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenResult = document.getElementById('screen-result');
    const container = document.getElementById('game-container');
    const resultHeading = document.getElementById('result-heading');
    const skipStripRight = document.getElementById('skip-strip-right');

    function setLeftNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setLeftNavZoneEnabled === 'function') {
            ScPlayableAd.setLeftNavZoneEnabled(enabled);
        }
    }
    function setRightNavZoneEnabled(enabled) {
        if (window.ScPlayableAd && typeof ScPlayableAd.setRightNavZoneEnabled === 'function') {
            ScPlayableAd.setRightNavZoneEnabled(enabled);
        }
    }

    function handleEndCardBackdropTap(clientX) {
        if (!screenResult.classList.contains('active')) return;
        if (clientX >= window.innerWidth * 0.15) return;
        resetGame();
    }

    screenResult.addEventListener('click', (e) => {
        if (e.target !== screenResult) return;
        handleEndCardBackdropTap(e.clientX);
    });

    screenResult.addEventListener('touchend', (e) => {
        if (e.target !== screenResult) return;
        const touch = e.changedTouches && e.changedTouches[0];
        if (!touch) return;
        handleEndCardBackdropTap(touch.clientX);
    });

    function maybeSkipToEnd() {
        if (!isPlaying) return false;
        if (Date.now() - gameStartTime < SKIP_TO_END_THRESHOLD_MS) return false;
        triggerWin();
        return true;
    }

    function triggerWin() {
        if (!isPlaying) return;
        isPlaying = false;
        skipStripRight.classList.remove('active');
        showResult();
    }

    container.addEventListener('click', (e) => {
        if (!isPlaying) return;
        if (e.target.closest('.card')) return;
        if (e.target.closest('#screen-start')) return;
        if (e.target.closest('#screen-result')) return;
        maybeSkipToEnd();
    });

    skipStripRight.addEventListener('click', (e) => {
        e.stopPropagation();
        maybeSkipToEnd();
    });

    function beginCountdown() {
        setTimeout(() => {
            screenStart.classList.remove('active');
            screenGame.classList.add('active');
            setTimeout(() => {
                AeroAudio.playTap();
                AeroAudio.startMusic();
                initGame();
            }, 300);
        }, 700);
    }

    function tryStart() {
        if (hasStarted) return;
        hasStarted = true;
        beginCountdown();
    }

    function onViewable(viewable) {
        if (viewable) {
            if (!hasStarted) tryStart();
            else AeroAudio.startMusic();
        } else {
            AeroAudio.stopMusic();
        }
    }

    if (typeof mraid !== 'undefined') {
        mraid.addEventListener('viewableChange', onViewable);
        if (mraid.getState() !== 'loading' && mraid.isViewable()) tryStart();
        mraid.addEventListener('ready', function () {
            if (mraid.isViewable()) tryStart();
        });
    } else {
        beginCountdown();
    }

    function initGame() {
        hasFlippedCard = false;
        lockBoard = false;
        firstCard = null;
        secondCard = null;
        matchesFound = 0;
        scoreTextElement.innerText = '0/' + TOTAL_PAIRS;
        screenResult.classList.remove('active');
        screenGame.classList.add('active');
        screenGame.classList.remove('under-result');
        isPlaying = true;
        gameStartTime = Date.now();
        skipStripRight.classList.remove('active');
        setLeftNavZoneEnabled(true);
        setRightNavZoneEnabled(true);
        setTimeout(() => {
            if (!isPlaying) return;
            setRightNavZoneEnabled(false);
            skipStripRight.classList.add('active');
        }, SKIP_TO_END_THRESHOLD_MS);
        document.querySelectorAll('.confetti').forEach(el => el.remove());

        cards = [...MENU_ITEMS, ...MENU_ITEMS];
        cards.sort(() => Math.random() - 0.5);

        boardElement.innerHTML = '';
        cards.forEach((item) => {
            const cardEl = document.createElement('div');
            cardEl.classList.add('card');
            cardEl.dataset.id = item.id;
            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-back"><span class="card-back-burger"><img src="${CARD_BACK_IMAGE}" alt="" aria-hidden="true"></span></div>
                    <div class="card-front">
                        <div class="match-badge">✔</div>
                        <div class="card-image"><img src="${item.image}" alt="${item.name}"></div>
                        <div class="card-name">${item.name}</div>
                    </div>
                </div>
            `;
            cardEl.addEventListener('click', flipCard);
            boardElement.appendChild(cardEl);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;
        if (this.classList.contains('matched')) return;

        AeroAudio.playTap();
        this.classList.add('flipped');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        const isMatch = firstCard.dataset.id === secondCard.dataset.id;
        if (isMatch) disableCards();
        else unflipCards();
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        matchesFound++;
        scoreTextElement.innerText = matchesFound + '/' + TOTAL_PAIRS;
        resetBoard();

        if (matchesFound === TOTAL_PAIRS) {
            isPlaying = false;
            skipStripRight.classList.remove('active');
            setTimeout(showResult, 800);
        }
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 1000);
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function generateConfetti() {
        const confEmojis = ['🎊','🎉','✨','🍔','🍟','📦'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.innerText = confEmojis[Math.floor(Math.random() * confEmojis.length)];
            const x = Math.random() * window.innerWidth;
            const size = 18 + Math.random() * 20;
            const duration = 2.5 + Math.random() * 2.5;
            const delay = Math.random() * 0.5;
            el.style.left = x + 'px';
            el.style.top = '-50px';
            el.style.fontSize = size + 'px';
            el.style.transition = `transform ${duration}s ease-in, top ${duration}s ease-in`;
            el.style.transitionDelay = delay + 's';
            screenGame.appendChild(el);
            setTimeout(() => {
                el.style.top = (window.innerHeight + 100) + 'px';
                el.style.transform = `rotate(${Math.random() * 720 - 360}deg)`;
            }, 50);
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, (duration + delay) * 1000 + 100);
        }
    }

    function showResult() {
        resultHeading.innerText = 'YOU MATCHED!';
        isPlaying = false;
        skipStripRight.classList.remove('active');
        screenGame.classList.add('active');
        screenGame.classList.add('under-result');
        AeroAudio.stopMusic();
        AeroAudio.playWin();
        // End card: block left-edge swipe-back; keep right strip pageable for skip-forward.
        setLeftNavZoneEnabled(false);
        setRightNavZoneEnabled(true);
        generateConfetti();
        setTimeout(() => {
            screenResult.classList.add('active');
        }, 300);
    }

    function resetGame() {
        isPlaying = false;
        setLeftNavZoneEnabled(true);
        setRightNavZoneEnabled(true);
        screenResult.classList.remove('active');
        screenGame.classList.remove('under-result');
        skipStripRight.classList.remove('active');
        document.querySelectorAll('.confetti').forEach(el => el.remove());
        AeroAudio.startMusic();
        initGame();
    }

    function handleCTA() {
        var url = 'https://www.whitecastle.com/';
        if (typeof mraid !== 'undefined') {
            mraid.open(url);
        } else {
            window.open(url, '_blank');
        }
    }
</script>

</body>
</html>
